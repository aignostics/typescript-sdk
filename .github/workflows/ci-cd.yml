name: CI/CD Pipeline

permissions: {}

on:
  schedule:
    # run every day at 7:00 AM UTC
    - cron: '0 7 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      E2E_REFRESH_TOKEN: ${{ secrets.E2E_REFRESH_TOKEN }}
      E2E_ADMIN_USER_PASSWORD: ${{ secrets.E2E_ADMIN_USER_PASSWORD }}

  check-generated:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate SDK client from vendored spec
        run: npx nx codegen sdk

      - name: Fail if committed client drifted from vendored spec
        run: |
          if ! git diff --exit-code packages/sdk/src/generated; then
            echo "::error::packages/sdk/src/generated is out of sync with packages/sdk/openapi.json. Run 'nx codegen sdk' and commit the result."
            exit 1
          fi

  build-docs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK package
        run: npx nx build sdk

      - name: Generate documentation
        run: npm run docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          cname: aignostics-platform-sdk.github.io

  run-ketryx-report:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_report-to-ketryx.yml
    with:
      build-name: 'pre-release'
    secrets:
      KETRYX_API_KEY: ${{ secrets.KETRYX_API_KEY }}

  codeql:
    if: (!contains(github.event.head_commit.message, 'skip:ci'))
    uses: ./.github/workflows/_codeql.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit
