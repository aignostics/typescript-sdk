name: Update vendored OpenAPI spec

permissions: {}

concurrency:
  group: update-openapi-spec
  cancel-in-progress: false

on:
  schedule:
    # run every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-spec:
    name: update-spec
    permissions:
      contents: write # peter-evans/create-pull-request pushes chore/update-openapi-spec
      pull-requests: write # peter-evans/create-pull-request opens the PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch spec and regenerate SDK client
        run: npm run update-spec

      - name: Create pull request
        # zizmor: ignore[superfluous-actions] the action updates the open PR on chore/update-openapi-spec and skips when nothing changed; gh pr create does neither
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(sdk): update vendored OpenAPI spec and regenerate client'
          title: 'chore(sdk): update vendored OpenAPI spec and regenerate client'
          body: |
            Automated update of `packages/sdk/openapi.json` from the live
            Platform API, with the generated client regenerated to match.
          branch: chore/update-openapi-spec
          delete-branch: true
